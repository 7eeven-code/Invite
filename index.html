<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pra você 💕</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="message">
                <h1>Oi</h1>
                <p>Queria te fazer uma pergunta...</p>
            </div>

            <div class="question">
                <h2>Você quer sair comigo?</h2>
            </div>

            <div class="buttons">
                <button class="btn btn-sim" id="yesBtn">Sim</button>
                <button class="btn btn-nao" id="noBtn">Não</button>
            </div>

            <div class="celebration" id="celebration" style="display: none;">
                <h2>Que bom! 💕</h2>
                <p>Você deixou meu dia especial</p>
            </div>
        </div>
    </div>

    <div id="hearts"></div>
    <script src="script.js"></script>
</body>
</html>
